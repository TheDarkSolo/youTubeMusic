# Base configuration. Real values come from environment variables (§6 of docs/ARCHITECTURE.md)
# or, for local development, from src/main/resources/application-local.yml (gitignored -
# copy application-local.yml.example and fill it in, then run with
# SPRING_PROFILES_ACTIVE=local).
server:
  # Render (and most PaaS) inject $PORT and expect the app to bind to it; SERVER_PORT stays
  # as a manual override for local/other hosts, defaulting to 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        # Local dev: Lax/not-Secure (plain HTTP, same-site frontend/backend). Cross-origin
        # prod deploy (frontend and backend on different domains, both HTTPS): set
        # COOKIE_SAME_SITE=none and COOKIE_SECURE=true - browsers require Secure whenever
        # SameSite=None.
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: yt-music-playlist-merger-backend

# §6 required backend env vars.
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

app:
  frontend-base-url: ${FRONTEND_BASE_URL}

logging:
  level:
    com.ytmusicmerger.backend: INFO
